<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px 42px;color:#fff;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 12% 5%,rgba(39,82,190,.23),transparent 38%),radial-gradient(ellipse at 88% 92%,rgba(111,24,170,.24),transparent 42%),#090d1b;display:flex;justify-content:center}
.page{width:100%;max-width:680px;margin:auto}
.player{width:100%;max-width:640px;margin:0 auto;aspect-ratio:9/16;max-height:78vh;background:#000;border-radius:30px;overflow:hidden;position:relative;display:grid;place-items:center;box-shadow:0 0 34px rgba(20,104,255,.12)}
video{width:100%;height:100%;object-fit:contain;background:#000}
.center-control{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#080808;cursor:pointer;box-shadow:0 0 30px rgba(0,0,0,.2)}
.center-control svg{width:42px;height:42px;fill:currentColor}
.center-control[hidden]{display:none}
.player.paused .center-control{display:grid}
.telegram{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:104px;margin:22px 0;padding:18px 24px;border-radius:28px;text-decoration:none;color:white;font-size:clamp(20px,4.5vw,29px);line-height:1.25;font-weight:800;letter-spacing:.4px;background:linear-gradient(110deg,#078fc9,#08baf0);box-shadow:0 8px 28px rgba(0,181,240,.24)}
.telegram svg{flex:0 0 38px;width:38px;height:38px;fill:white}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.category{min-height:190px;position:relative;overflow:hidden;border-radius:28px;padding:22px 8px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:white;text-decoration:none}
.japan{background:linear-gradient(145deg,#ff536c,#e90c3c);box-shadow:0 8px 28px rgba(255,30,75,.27)}
.indonesia{background:linear-gradient(145deg,#05e477,#00b94f);box-shadow:0 8px 28px rgba(0,224,112,.24)}
.west{background:linear-gradient(145deg,#389cff,#1763e9);box-shadow:0 8px 28px rgba(35,126,255,.26)}
.flag{font-size:43px;line-height:1.2;margin-bottom:8px}
.category strong{font-size:clamp(15px,3.2vw,21px);letter-spacing:1.1px}
.category small{margin-top:8px;font-size:14px}
.tag{position:absolute;top:10px;right:8px;border-radius:20px;background:rgba(0,0,0,.23);padding:6px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.note{text-align:center;color:#9da8c4;font-size:12px;margin:22px 0 0}
@media(max-width:430px){body{padding:22px 14px 34px}.player{border-radius:26px;max-height:none}.center-control{width:96px;height:96px}.categories{gap:12px}.category{min-height:174px;border-radius:24px}.tag{top:8px;right:6px;font-size:10px;padding:5px 7px}}
</style>
</head>
<body>
<main class="page">
  <section class="player paused" id="player" aria-label="Pemutar video">
    <video id="video" controls playsinline preload="metadata">
      <source src="https://ik.imagekit.io/wr7hpcelg/vid_1793289797_133272658424f606.mp4" type="video/mp4">
      Browser Anda tidak mendukung pemutar video.
    </video>
    <button class="center-control" id="centerControl" type="button" aria-label="Putar video">
      <svg id="controlIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5c0-.8.87-1.28 1.54-.85l10.1 6.5a1 1 0 0 1 0 1.7l-10.1 6.5A1 1 0 0 1 8 18.5z"/></svg>
    </button>
  </section>

  <a class="telegram" href="https://t.me/topviralindodrama" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.4 18.5 19c-.24 1.03-.86 1.28-1.74.8l-4.8-3.54-2.32 2.23c-.26.26-.48.48-.98.48l.35-4.9 8.92-8.06c.39-.35-.09-.55-.6-.2L6.3 12.9l-4.7-1.47c-1.02-.32-1.04-1.02.22-1.52L20.2 3.1c.84-.3 1.58.2 1.3 1.3z"/></svg>
    <span>BERGABUNGLAH DENGAN<br>TELEGRAM</span>
  </a>

  <nav class="categories" aria-label="Kategori video">
    <a class="category japan" href="https://auctionr.org/4/97e2ef6366ebdb81df3d707db052c269" target="_blank" rel="noopener noreferrer"><span class="tag">🔥 PANAS</span><span class="flag">🇯🇵</span><strong>JEPANG</strong><small>Jepang</small><small>Koleksi 1.2K</small></a>
    <a class="category indonesia" href="https://auctionr.org/4/97e2ef6366ebdb81df3d707db052c269" target="_blank" rel="noopener noreferrer"><span class="tag">⭐ BARU</span><span class="flag">🇮🇩</span><strong>INDONESIA</strong><small>Indonesia</small><small>Koleksi 840</small></a>
    <a class="category west" href="https://auctionr.org/4/97e2ef6366ebdb81df3d707db052c269" target="_blank" rel="noopener noreferrer"><span class="tag">💥 TERATAS</span><span class="flag">🌍</span><strong>BARAT</strong><small>Barat</small><small>Koleksi 2.1K</small></a>
  </nav>
  <p class="note" id="status">Video demo non-eksplisit • Tekan Play untuk memutar.</p>
</main>
<script>
const video=document.getElementById('video');
const player=document.getElementById('player');
const button=document.getElementById('centerControl');
const icon=document.getElementById('controlIcon');
const status=document.getElementById('status');
const smartlink='https://auctionr.org/4/97e2ef6366ebdb81df3d707db052c269;

const playPath='<path d="M8 5.5c0-.8.87-1.28 1.54-.85l10.1 6.5a1 1 0 0 1 0 1.7l-10.1 6.5A1 1 0 0 1 8 18.5z"/>';
const pausePath='<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

function timeLabel(value){
  if(!Number.isFinite(value)) return '--:--';
  const m=Math.floor(value/60),s=Math.floor(value%60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function updateStatus(){
  status.textContent=`Video ${timeLabel(video.currentTime)} / ${timeLabel(video.duration)}`;
}
button.addEventListener('click',()=>{
  if(video.paused){
    // Buka tautan iklan hanya saat pengunjung menekan tombol Play pertama kali.
    if(!sessionStorage.getItem('adOpened')){
      window.open(smartlink,'_blank','noopener,noreferrer');
      sessionStorage.setItem('adOpened','1');
    }
    video.play().catch(()=>{status.textContent='Video tidak dapat diputar. Coba tombol Play pada kontrol video.';});
  }else{
    video.pause();
  }
});
video.addEventListener('play',()=>{
  player.classList.remove('paused');
  button.setAttribute('aria-label','Jeda video');
  icon.innerHTML=pausePath;
  updateStatus();
});
video.addEventListener('pause',()=>{
  player.classList.add('paused');
  button.setAttribute('aria-label','Putar video');
  icon.innerHTML=playPath;
  if(!video.ended) updateStatus();
});
video.addEventListener('timeupdate',updateStatus);
video.addEventListener('loadedmetadata',()=>{
  status.textContent=`Durasi video: ${timeLabel(video.duration)}`;
});
video.addEventListener('ended',()=>{
  player.classList.add('paused');
  status.textContent=`Video selesai • ${timeLabel(video.duration)}`;
});
video.addEventListener('error',()=>{
  status.textContent='Video demo gagal dimuat. Periksa koneksi internet.';
});
</script>
</body>
</html>
